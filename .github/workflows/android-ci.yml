name: Android
on:
  push:
    branches:
      - master
  pull_request:
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        newArchEnabled: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install npm dependencies
        run: yarn --frozen-lockfile
        shell: bash
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build Android test app
        working-directory: example/android
        shell: bash
        env:
          MATRIX_NEWARCHENABLED: ${{ matrix.newArchEnabled }}
        run: ./gradlew -PnewArchEnabled="${MATRIX_NEWARCHENABLED}" --no-daemon clean build check test
    timeout-minutes: 60
